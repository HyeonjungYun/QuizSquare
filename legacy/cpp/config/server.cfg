# Quiz MMO 서버 설정. 모든 게임플레이/네트워크 수치는 코드에 박지 않고 여기서 읽는다.
# 형식: key = value, '#' 뒤는 주석. 서버 시작 시 1회 로드.

# --- 네트워크 ---
net.port = 7777
net.bind = 0.0.0.0
net.worker_threads = 0          # 0 = CPU 코어 수(최소 2)
net.max_sessions = 2000         # 초과 접속은 즉시 닫힌다
net.recv_buffer_bytes = 65536   # 세션당 수신 버퍼. 최대 패킷(4096)의 2배 이상이어야 한다
net.accept_backlog = 64         # 미리 걸어두는 AcceptEx 수

# --- 게임 루프 ---
game.tick_hz = 20               # 로직 스레드 틱. 룸 Update(dt) 호출 주기
game.world_name = Plaza

# --- 퀴즈 ---
quiz.room_size = 20             # 대기열에서 이 인원이 모이면 퀴즈방 생성
quiz.match_check_interval_sec = 1.0
quiz.room_duration_sec = 30.0   # 퀴즈 로직(스토리 004) 전까지의 자리표시 길이. 끝나면 월드로 복귀

# --- 로그 ---
log.level = info                # debug | info | warn | error
log.status_interval_sec = 10    # 세션/룸/대기열 현황 로그 주기
